# Bootstrap packages must be installed with raw commands, because ubuntu
# xenial+ cloud images don't have python2.7 installed, and ansible doesn't yet
# support python3.

- name: Wait until cloud-init has finished running
  raw: test -e /usr/bin/cloud-init && cloud-init status --wait
  ignore_errors: yes

#- name: Remove expired nginx key
#  raw: "apt-key del 7BD9BF62"
#  ignore_errors: yes
#  become: yes

- name: Ensure all conflicting Nginx sources are removed
  raw: grep -rl "nginx.org" /etc/apt/sources.list /etc/apt/sources.list.d/ | xargs rm -f
  ignore_errors: yes

- name: Remove any old Nginx GPG keys (if they exist)
  raw: rm -f /usr/share/keyrings/nginx-archive-keyring.gpg
  ignore_errors: yes

- name: Import correct Nginx GPG signing key
  raw: |
    curl -fsSL https://nginx.org/keys/nginx_signing.key | gpg --dearmor | tee /usr/share/keyrings/nginx-archive-keyring.gpg > /dev/null
  register: gpg_key_result
  ignore_errors: yes

- name: Debug GPG key import result
  debug:
    msg: "{{ gpg_key_result.stdout_lines }}"

- name: Add correct Nginx repository
  raw: |
    echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] http://nginx.org/packages/ubuntu/ $(lsb_release -cs) nginx" | tee /etc/apt/sources.list.d/nginx.list
  ignore_errors: yes

- name: Verify APT sources to check Nginx repo
  raw: cat /etc/apt/sources.list /etc/apt/sources.list.d/*.list
  register: apt_sources_check
  ignore_errors: yes

- name: Display APT sources debug output
  debug:
    msg: "{{ apt_sources_check.stdout_lines }}"

- name: Update apt-get
  raw: apt-get update -qq
  register: python_update_result
  until: python_update_result.rc == 0
  retries: 10
  delay: 10

- name: Install packages
  raw: "apt-get install -qq {{ item }}"
  with_items: "{{ python_packages }}"
  retries: 10
  delay: 10
